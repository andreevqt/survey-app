<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Polls — UI Kit</title>
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%20fill%3D%22none%22%3E%0A%20%20%0A%20%20%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2211%22%20fill%3D%22%234F46E5%22%3E%3C%2Frect%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2213%22%20cy%3D%2216%22%20r%3D%223.25%22%20fill%3D%22%23FFFFFF%22%3E%3C%2Fcircle%3E%0A%20%20%3Ccircle%20cx%3D%2213%22%20cy%3D%2216%22%20r%3D%221.4%22%20fill%3D%22%234F46E5%22%3E%3C%2Fcircle%3E%0A%20%20%3Crect%20x%3D%2220%22%20y%3D%2214%22%20width%3D%2218%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23FFFFFF%22%3E%3C%2Frect%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2213%22%20cy%3D%2224%22%20r%3D%223.25%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%221.6%22%20opacity%3D%220.6%22%3E%3C%2Fcircle%3E%0A%20%20%3Crect%20x%3D%2220%22%20y%3D%2222%22%20width%3D%2214%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23FFFFFF%22%20opacity%3D%220.55%22%3E%3C%2Frect%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2213%22%20cy%3D%2232%22%20r%3D%223.25%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%221.6%22%20opacity%3D%220.6%22%3E%3C%2Fcircle%3E%0A%20%20%3Crect%20x%3D%2220%22%20y%3D%2230%22%20width%3D%2210%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23FFFFFF%22%20opacity%3D%220.55%22%3E%3C%2Frect%3E%0A%3C%2Fsvg%3E" type="image/svg+xml" />
  <style>/* Polls UI kit — vanilla CSS extract of the Tailwind classes the app uses.
   Loaded by every component file so they render in isolation or together. */

:root {
  --indigo-50:#eef2ff; --indigo-100:#e0e7ff; --indigo-300:#a5b4fc;
  --indigo-400:#818cf8; --indigo-500:#6366f1; --indigo-600:#4f46e5;
  --indigo-700:#4338ca;
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
  --gray-300:#d1d5db; --gray-400:#9ca3af; --gray-500:#6b7280;
  --gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937;
  --gray-900:#111827;
  --green-100:#dcfce7; --green-700:#15803d;
  --red-50:#fef2f2; --red-100:#fee2e2; --red-200:#fecaca;
  --red-600:#dc2626; --red-700:#b91c1c;
  --blue-100:#dbeafe; --blue-700:#1d4ed8;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  color: var(--gray-900);
  background: var(--gray-50);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
button, input, select, textarea { font-family: inherit; }
a { color: var(--indigo-600); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Buttons ───────────────────────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:6px; font-weight:500; transition: background-color 200ms ease,
    border-color 200ms ease, color 200ms ease; border:0; cursor:pointer;
  padding:8px 16px; font-size:14px; outline:none;
}
.btn:focus-visible { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--indigo-500); }
.btn-sm { padding:6px 12px; font-size:14px; }
.btn-lg { padding:12px 24px; font-size:16px; }
.btn-primary { background: var(--indigo-600); color:#fff; }
.btn-primary:hover { background: var(--indigo-700); }
.btn-primary:disabled { background: var(--indigo-300); cursor:not-allowed; }
.btn-secondary { background:#fff; color: var(--gray-700); border:1px solid var(--gray-300); }
.btn-secondary:hover { background: var(--gray-50); }
.btn-danger { background: var(--red-600); color:#fff; }
.btn-danger:hover { background: var(--red-700); }
.btn-ghost { background: transparent; color: var(--gray-600); }
.btn-ghost:hover { background: var(--gray-100); }
.btn-soft-primary { background: var(--indigo-50); color: var(--indigo-700); padding:6px 12px; font-size:12px; }
.btn-soft-primary:hover { background: var(--indigo-100); }
.btn-soft-danger { background: var(--red-100); color: var(--red-700); padding:6px 12px; font-size:12px; }
.btn-soft-danger:hover { background:#fecaca; }
.btn-row { background:#fff; color: var(--gray-700); border:1px solid var(--gray-300); padding:6px 12px; font-size:12px; }
.btn-row:hover { background: var(--gray-50); }

/* ── Inputs ────────────────────────────────────────────────────────────── */
.input, .textarea, .select {
  width:100%; padding:8px 12px; font-size:14px; border:1px solid var(--gray-300);
  border-radius:6px; background:#fff; color: var(--gray-900); outline:none;
  transition: border-color 200ms ease, box-shadow 200ms ease;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--indigo-500); box-shadow: 0 0 0 1px var(--indigo-500);
}
.textarea { resize: vertical; min-height: 76px; }
.label { display:block; font-size:14px; font-weight:500; color: var(--gray-700); margin-bottom:4px; }
.error-text { margin:4px 0 0; font-size:12px; color: var(--red-600); }

/* ── Cards ─────────────────────────────────────────────────────────────── */
.card {
  background:#fff; border:1px solid var(--gray-200); border-radius:12px;
  box-shadow: var(--shadow-sm);
}
.card-sm { padding:20px; }
.card-md { padding:24px; }
.card-lg { padding:32px; }

/* ── Badges ────────────────────────────────────────────────────────────── */
.badge {
  display:inline-flex; align-items:center; padding:2px 10px; border-radius:9999px;
  font-size:12px; font-weight:500;
}
.badge-default { background: var(--gray-100); color: var(--gray-700); }
.badge-success { background: var(--green-100); color: var(--green-700); }
.badge-danger  { background: var(--red-100);   color: var(--red-700); }
.badge-info    { background: var(--blue-100);  color: var(--blue-700); }
.badge-warning { background:#fef9c3; color:#a16207; }

/* ── Avatar ────────────────────────────────────────────────────────────── */
.avatar {
  display:inline-flex; align-items:center; justify-content:center; border-radius:9999px;
  background: var(--indigo-100); color: var(--indigo-700);
  font-weight:600; flex-shrink:0;
}
.avatar-sm { width:32px; height:32px; font-size:13px; }
.avatar-md { width:36px; height:36px; font-size:13px; }
.avatar-lg { width:48px; height:48px; font-size:18px; }
.avatar-dark { background: var(--indigo-600); color:#fff; }

/* ── Spinner ───────────────────────────────────────────────────────────── */
.spinner {
  display:inline-block; border:2px solid var(--gray-300); border-top-color: var(--indigo-600);
  border-radius:9999px; animation: spin 1s linear infinite;
}
.spinner-sm { width:16px; height:16px; }
.spinner-md { width:32px; height:32px; }
.spinner-lg { width:48px; height:48px; border-width:4px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Modal ─────────────────────────────────────────────────────────────── */
.modal-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;
}
.modal {
  background:#fff; border:1px solid var(--gray-200); border-radius:12px;
  box-shadow: var(--shadow-xl); width:100%; max-width:480px; padding:24px;
}

/* ── Layout helpers ────────────────────────────────────────────────────── */
.container-sm { max-width: 512px; margin: 0 auto; }
.container-md { max-width: 768px; margin: 0 auto; }
.container-lg { max-width: 1024px; margin: 0 auto; }
.page { min-height: 100vh; background: var(--gray-50); padding: 32px 16px; }

/* ── Admin shell ───────────────────────────────────────────────────────── */
.admin-shell {
  display:flex; min-height: 100vh; background: var(--gray-50);
}
.admin-sidebar {
  width: 256px; flex-shrink:0; background: var(--gray-900); color:#fff;
  display:flex; flex-direction:column;
}
.admin-content { flex:1; min-width:0; display:flex; flex-direction:column; }
.admin-header {
  background:#fff; border-bottom:1px solid var(--gray-200);
  padding: 16px 24px; display:flex; align-items:center; justify-content:space-between;
}

/* ── Table ─────────────────────────────────────────────────────────────── */
.table-wrap { overflow:hidden; background:#fff; border:1px solid var(--gray-200); border-radius:12px; box-shadow: var(--shadow-sm); }
.table { width:100%; border-collapse: collapse; }
.table th {
  text-align:left; padding:12px 24px; background: var(--gray-50);
  font-size:11px; font-weight:500; color: var(--gray-500);
  text-transform: uppercase; letter-spacing:0.05em;
  border-bottom:1px solid var(--gray-200);
}
.table td {
  padding:16px 24px; border-top:1px solid var(--gray-200); font-size:14px; color: var(--gray-700);
}
.table tr:hover td { background: var(--gray-50); }
.table tr.is-selected td { background: var(--indigo-50); }

/* utility-ish */
.flex { display:flex; }
.flex-col { display:flex; flex-direction:column; }
.items-center { align-items:center; }
.justify-between { justify-content:space-between; }
.gap-2 { gap:8px; } .gap-3 { gap:12px; } .gap-4 { gap:16px; } .gap-6 { gap:24px; }
.mt-1 { margin-top:4px; } .mt-2 { margin-top:8px; } .mt-4 { margin-top:16px; }
.mt-6 { margin-top:24px; } .mt-8 { margin-top:32px; }
.text-xs { font-size:12px; } .text-sm { font-size:14px; }
.text-lg { font-size:18px; } .text-xl { font-size:20px; }
.text-2xl { font-size:24px; } .text-3xl { font-size:30px; } .text-4xl { font-size:36px; }
.font-medium { font-weight:500; } .font-semibold { font-weight:600; } .font-bold { font-weight:700; }
.text-gray-500 { color: var(--gray-500); } .text-gray-600 { color: var(--gray-600); }
.text-gray-700 { color: var(--gray-700); } .text-gray-900 { color: var(--gray-900); }
.text-indigo-600 { color: var(--indigo-600); }
.text-white { color:#fff; }

/* ── Toggle / Switch ───────────────────────────────────────────────────── */
.toggle {
  --t-h: 20px;  --t-w: 36px;  --t-knob: 16px;
  position: relative; display: inline-flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
  font-family: inherit; font-size: 14px; color: var(--gray-700);
}
.toggle-sm { --t-h: 18px; --t-w: 32px; --t-knob: 14px; font-size: 13px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .track {
  width: var(--t-w); height: var(--t-h); border-radius: 9999px;
  background: var(--gray-300); position: relative; flex-shrink: 0;
  transition: background-color 200ms ease;
}
.toggle .knob {
  position: absolute; top: 2px; left: 2px;
  width: var(--t-knob); height: var(--t-knob); border-radius: 9999px;
  background: #fff; box-shadow: var(--shadow-sm);
  transition: transform 200ms ease;
}
.toggle.is-on .track { background: var(--indigo-600); }
.toggle.is-on .knob  { transform: translateX(calc(var(--t-w) - var(--t-knob) - 4px)); }
.toggle:hover.is-on .track { background: var(--indigo-700); }
.toggle:hover:not(.is-on) .track { background: var(--gray-400); }
.toggle.is-disabled { cursor: not-allowed; opacity: 0.55; }
.toggle:focus-within .track { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--indigo-500); }

/* ── Dropdown / Select / MultiSelect / MenuPopover ─────────────────────── */
.dd { position: relative; display: inline-block; font-family: inherit; }
.dd-trigger {
  display: inline-flex; align-items: center; justify-content: space-between;
  gap: 8px; min-height: 36px; padding: 7px 10px 7px 12px;
  background: #fff; color: var(--gray-700);
  border: 1px solid var(--gray-300); border-radius: 6px;
  font-size: 14px; cursor: pointer; transition: border-color 200ms ease;
  outline: none; min-width: 0; width: 100%; font-family: inherit;
}
.dd-trigger:hover { border-color: var(--gray-400); }
.dd-trigger:focus-visible, .dd-trigger.is-open {
  border-color: var(--indigo-500); box-shadow: 0 0 0 1px var(--indigo-500);
}
.dd-trigger.is-placeholder { color: var(--gray-400); }
.dd-trigger .chev { color: var(--gray-500); transition: transform 200ms ease; flex-shrink: 0; }
.dd-trigger.is-open .chev { transform: rotate(180deg); }
.dd-trigger-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.dd-popover {
  position: absolute; top: calc(100% + 4px); left: 0;
  min-width: 100%; max-height: 280px; overflow-y: auto;
  background: #fff; border: 1px solid var(--gray-200); border-radius: 8px;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.10), 0 2px 4px -2px rgb(0 0 0 / 0.10);
  padding: 4px; z-index: 50;
}
.dd-item {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  padding: 8px 10px; border-radius: 6px;
  font-size: 13px; color: var(--gray-700); cursor: pointer; user-select: none;
  white-space: nowrap;
}
.dd-item:hover { background: var(--gray-100); }
.dd-item.is-selected { background: var(--indigo-50); color: var(--indigo-700); font-weight: 500; }
.dd-item.is-disabled { color: var(--gray-400); cursor: not-allowed; }
.dd-item.is-disabled:hover { background: transparent; }
.dd-item.is-danger { color: var(--red-600); }
.dd-item.is-danger:hover { background: var(--red-50); color: var(--red-700); }
.dd-item .leading, .dd-item .trailing { display: inline-flex; align-items: center; flex-shrink: 0; }
.dd-item .leading svg, .dd-item .trailing svg { width: 14px; height: 14px; }
.dd-divider { height: 1px; background: var(--gray-200); margin: 4px 2px; }

.dd-check {
  width: 14px; height: 14px; flex-shrink: 0;
  border: 1.5px solid var(--gray-300); border-radius: 3px;
  display: inline-flex; align-items: center; justify-content: center;
  color: transparent;
  transition: background-color 150ms ease, border-color 150ms ease;
}
.dd-item.is-selected .dd-check {
  background: var(--indigo-600); border-color: var(--indigo-600); color: #fff;
}

/* ── IconButton (round) ────────────────────────────────────────────────── */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0;
  border-radius: 9999px; border: 0; cursor: pointer;
  background: transparent; color: var(--gray-600);
  transition: background-color 200ms ease, color 200ms ease;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--gray-100); color: var(--gray-900); }
.icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--indigo-500); }
.icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.icon-btn:disabled:hover { background: transparent; color: var(--gray-600); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn-sm { width: 30px; height: 30px; }
.icon-btn-sm svg { width: 16px; height: 16px; }
.icon-btn-lg { width: 40px; height: 40px; }
.icon-btn-lg svg { width: 20px; height: 20px; }
.icon-btn-soft   { background: var(--gray-100); color: var(--gray-700); }
.icon-btn-soft:hover { background: var(--gray-200); color: var(--gray-900); }
.icon-btn-indigo { background: var(--indigo-50); color: var(--indigo-600); }
.icon-btn-indigo:hover { background: var(--indigo-100); color: var(--indigo-700); }
.icon-btn-danger { color: var(--red-600); }
.icon-btn-danger:hover { background: var(--red-50); color: var(--red-700); }

/* Pill Button modifier */
.btn-pill { border-radius: 9999px; }

/* ── NavLink (top-bar nav link) ─────────────────────────────────────── */
.nav-link {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 4px;
  font-family: inherit; font-size: 14px; font-weight: 500; color: var(--gray-600);
  text-decoration: none; background: transparent; cursor: pointer;
  position: relative; transition: color 200ms ease; border: 0;
}
.nav-link:hover { color: var(--gray-900); text-decoration: none; }
.nav-link.is-active { color: var(--gray-900); }
.nav-link.is-active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--indigo-600); border-radius: 2px 2px 0 0;
}
.nav-link:focus-visible {
  outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--indigo-500);
  border-radius: 6px;
}
.nav-link svg { width: 14px; height: 14px; }

/* ── SearchInput ────────────────────────────────────────────────────── */
.search { position: relative; display: inline-block; width: 100%; }
.search .search-field {
  width: 100%; padding: 8px 12px 8px 36px;
  font-size: 14px; font-family: inherit; color: var(--gray-900); background: #fff;
  border: 1px solid var(--gray-300); border-radius: 6px; outline: none;
  transition: border-color 200ms ease, box-shadow 200ms ease;
}
.search .search-field::placeholder { color: var(--gray-400); }
.search .search-field:hover { border-color: var(--gray-400); }
.search .search-field:focus { border-color: var(--indigo-500); box-shadow: 0 0 0 1px var(--indigo-500); }
.search .search-field:disabled { background: var(--gray-50); color: var(--gray-400); cursor: not-allowed; }
.search.has-kbd .search-field { padding-right: 56px; }
.search .search-icon {
  position: absolute; top: 50%; left: 12px; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--gray-400); pointer-events: none;
}
.search .search-kbd {
  position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 20px; padding: 0 6px;
  background: var(--gray-100); color: var(--gray-500); border-radius: 6px;
  font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
  pointer-events: none;
}

/* ── IconButton dot indicator ───────────────────────────────────────── */
.icon-btn { position: relative; overflow: visible; }
.icon-btn-dot {
  position: absolute; top: 4px; right: 4px;
  width: 9px; height: 9px; border-radius: 9999px;
  box-shadow: 0 0 0 2px #fff; pointer-events: none;
}
.icon-btn-dot.red    { background: #ef4444; }
.icon-btn-dot.indigo { background: var(--indigo-600); }

/* ── Dashboard header responsive collapse ───────────────────────────── */
.dash-header-row { display: flex; align-items: center; gap: 20px; min-width: 0; }
.dash-header-row .search { max-width: 240px; min-width: 140px; flex: 0 1 240px; }
.dash-header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.dash-new-poll-label { white-space: nowrap; }
@media (max-width: 1080px) {
  .dash-header-row .search { display: none; }
}
@media (max-width: 880px) {
  .dash-header-row .nav-link span:last-child:not(:first-child) { display: none; }
  .dash-new-poll-label { display: none; }
  .dash-user-trigger .dash-user-name,
  .dash-user-trigger .dash-user-chev { display: none; }
  .dash-user-trigger { padding: 2px !important; border: 0 !important; }
}
@media (max-width: 640px) {
  .dash-header-row .brand b { display: none; }
}

/* ── Modal ─────────────────────────────────────────────────────────────── */
.modal-card {
  background: #fff; border: 1px solid var(--gray-200);
  border-radius: 12px;
  box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.10), 0 8px 10px -6px rgb(0 0 0 / 0.10);
  width: 100%; max-width: 640px; max-height: calc(100vh - 32px);
  display: flex; flex-direction: column;
  animation: modal-pop-in 200ms cubic-bezier(0.22, 1, 0.36, 1);
}
.modal-sm { max-width: 480px; }
.modal-md { max-width: 640px; }
.modal-lg { max-width: 880px; }
.modal-xl { max-width: 1040px; }
.modal-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding: 20px 24px 16px;
  border-bottom: 1px solid var(--gray-200);
}
.modal-title { margin: 0; font-size: 18px; font-weight: 600; color: var(--gray-900); letter-spacing: -0.01em; }
.modal-sub   { margin: 4px 0 0; font-size: 13px; color: var(--gray-500); line-height: 1.5; }
.modal-body  { padding: 20px 24px; overflow-y: auto; font-size: 14px; color: var(--gray-700); line-height: 1.55; flex: 1; min-height: 0; }
.modal-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 16px 24px; border-top: 1px solid var(--gray-200);
  background: var(--gray-50); border-radius: 0 0 12px 12px;
}
@keyframes modal-pop-in {
  from { opacity: 0; transform: scale(0.96) translateY(4px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* ── SidebarNav ────────────────────────────────────────────────────────── */
.side {
  display: flex; flex-direction: column;

/* ── Toast ─────────────────────────────────────────────────────────────── */
.toast-region {
  position: fixed; top: 16px; right: 16px; z-index: 60;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  min-width: 280px; max-width: 420px; padding: 12px 14px;
  background: #fff; border: 1px solid var(--gray-200); border-left-width: 3px;
  border-radius: 6px;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.10), 0 2px 4px -2px rgb(0 0 0 / 0.10);
  font-family: inherit; pointer-events: auto;
  animation: toast-in 220ms cubic-bezier(0.22, 1, 0.36, 1);
}
.toast.is-leaving { animation: toast-out 180ms ease forwards; }
.toast-default { border-left-color: var(--gray-400); }
.toast-success { border-left-color: #16a34a; } .toast-success .toast-icon { color: #16a34a; }
.toast-error   { border-left-color: var(--red-600); } .toast-error .toast-icon { color: var(--red-600); }
.toast-info    { border-left-color: var(--indigo-600); } .toast-info .toast-icon { color: var(--indigo-600); }
.toast-icon { display: inline-flex; flex-shrink: 0; margin-top: 1px; }
.toast-icon svg { width: 16px; height: 16px; }
.toast-content { flex: 1; min-width: 0; }
.toast-title { margin: 0; font-size: 13px; font-weight: 600; color: var(--gray-900); }
.toast-body  { margin: 2px 0 0; font-size: 12px; color: var(--gray-600); line-height: 1.5; }
.toast-close { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 0; background: transparent; cursor: pointer; color: var(--gray-400); border-radius: 6px; margin: -2px -4px -2px 0; }
.toast-close:hover { color: var(--gray-700); background: var(--gray-100); }
.toast-close svg { width: 12px; height: 12px; }
@keyframes toast-in  { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-out { from { opacity: 1; transform: translateY(0); }  to { opacity: 0; transform: translateY(-8px); } }

/* ── Tooltip ───────────────────────────────────────────────────────────── */
.tooltip-wrap { position: relative; display: inline-flex; }
.tooltip {
  position: absolute; z-index: 70;
  background: var(--gray-900); color: #fff;
  font-family: inherit; font-size: 12px; line-height: 1.4;

}
.tooltip-wrap[data-tooltip-open="true"] .tooltip { opacity: 1; }
.tooltip-top    { bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); }
.tooltip-bottom { top:    calc(100% + 8px); left: 50%; transform: translateX(-50%); }

// Primitives — Button, Badge, Spinner, Input, Avatar
// Mirrors components/ui/* from andreevqt/polls.

function Spinner({ size = "md", className = "" }) {
  return <span className={`spinner spinner-${size} ${className}`} role="status" aria-label="Loading" />;
}

function Button({
  children, variant = "primary", size = "md", isLoading = false,
  disabled, className = "", ...props
}) {
  const sizeCls = size === "sm" ? "btn-sm" : size === "lg" ? "btn-lg" : "";
  return (
    <button
      disabled={disabled || isLoading}
      className={`btn btn-${variant} ${sizeCls} ${className}`}
      {...props}
    >
      {isLoading && <Spinner size="sm" />}
      {children}
    </button>
  );
}

function Badge({ children, variant = "default", className = "" }) {
  return <span className={`badge badge-${variant} ${className}`}>{children}</span>;
}

function Avatar({ name, size = "md", variant = "light" }) {
  const initial = (name || "?").charAt(0).toUpperCase();
  return (
    <div className={`avatar avatar-${size} ${variant === "dark" ? "avatar-dark" : ""}`}>
      {initial}
    </div>
  );
}

function Input({ label, error, id, ...props }) {
  const inputId = id || `i-${Math.random().toString(36).slice(2, 7)}`;
  return (
    <div>
      {label && <label htmlFor={inputId} className="label">{label}</label>}
      <input id={inputId} className="input" {...props} />
      {error && <p className="error-text">{error}</p>}
    </div>
  );
}

function Field({ label, error, children }) {
  return (
    <div>
      {label && <label className="label">{label}</label>}
      {children}
      {error && <p className="error-text">{error}</p>}
    </div>
  );
}

const STAT_ICONS = {

const TONE_BG = {
  indigo: "var(--indigo-50)",  green: "#dcfce7",  blue: "#dbeafe",  amber: "#fef3c7",
};
const TONE_FG = {
  indigo: "var(--indigo-600)", green: "#16a34a",  blue: "#2563eb",  amber: "#b45309",
};

/* Compact area sparkline. Renders an indigo curve + soft fill. */
function Sparkline({ data, color = "var(--indigo-600)", fill = "rgb(99 102 241 / 0.16)", w = 96, h = 32 }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const stepX = w / (data.length - 1);
  const pts = data.map((v, i) => [i * stepX, h - 2 - ((v - min) / range) * (h - 4)]);
  const path = pts.map(([x, y], i) => `${i === 0 ? "M" : "L"} ${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const area = `${path} L ${w} ${h} L 0 ${h} Z`;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      <path d={area} fill={fill} />
      <path d={path} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
      {/* End dot */}
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="2.5" fill={color} />
    </svg>
  );
}

function StatCard({ title, value, icon, tone = "indigo", description, trend, sparkline }) {

        {STAT_ICONS[icon]}
      </svg>
    );
  } else if (typeof icon === "string") {
    // legacy: emoji fallback
    iconNode = <span style={{ fontSize: 22 }}>{icon}</span>;
  } else {
    iconNode = icon;
  }

  return (
    <div className="card" style={{ padding: 20, position: "relative", overflow: "hidden" }}>
      <div className="flex items-center justify-between" style={{ alignItems: "flex-start" }}>

                   strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">

          {description && (

        {sparkline && (

const { useId: useIdP } = React;

const _IconChev = (p) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
       strokeLinecap="round" strokeLinejoin="round" width="14" height="14" {...p}>
    <path d="m6 9 6 6 6-6" />
  </svg>
);
const _IconCheck = (p) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"
       strokeLinecap="round" strokeLinejoin="round" width="12" height="12" {...p}>
    <path d="M20 6 9 17l-5-5" />
  </svg>
);
const _IconKebab = (p) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
       strokeLinecap="round" strokeLinejoin="round" width="18" height="18" {...p}>
    <circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" />
  </svg>
);

function useOutsideClose(ref, onClose) {
  React.useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) onClose(); }
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, [ref, onClose]);
}

function Toggle({ checked, onChange, label, size = "md", disabled }) {
  const id = useIdP();
  return (
    <label htmlFor={id}
      className={`toggle ${size === "sm" ? "toggle-sm" : ""} ${checked ? "is-on" : ""} ${disabled ? "is-disabled" : ""}`}>
      <input id={id} type="checkbox" checked={!!checked} disabled={disabled}
             onChange={(e) => onChange && onChange(e.target.checked)} />
      <span className="track"><span className="knob" /></span>
      {label && <span className="toggle-label">{label}</span>}
    </label>
  );
}

function Dropdown({ value, options = [], onChange, placeholder = "Select…", width, disabled }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  useOutsideClose(ref, () => setOpen(false));
  const selected = options.find((o) => o.value === value);
  return (
    <div className="dd" ref={ref} style={{ width }}>
      <button type="button" disabled={disabled}
        className={`dd-trigger ${open ? "is-open" : ""} ${!selected ? "is-placeholder" : ""}`}
        onClick={() => setOpen((p) => !p)}
        aria-haspopup="listbox" aria-expanded={open}>
        <span className="dd-trigger-label">
          {selected ? (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              {selected.icon}{selected.label}
            </span>
          ) : placeholder}
        </span>
        <_IconChev className="chev" />
      </button>
      {open && (
        <div className="dd-popover" role="listbox">
          {options.map((o) => {
            const isSel = o.value === value;
            return (
              <div key={o.value}
                className={`dd-item ${isSel ? "is-selected" : ""} ${o.disabled ? "is-disabled" : ""}`}
                role="option" aria-selected={isSel}
                onClick={() => { if (o.disabled) return; onChange && onChange(o.value); setOpen(false); }}>
                <span className="leading" style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                  {o.icon}{o.label}
                </span>
                {isSel && <span className="trailing"><_IconCheck /></span>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MultiSelect({ value = [], options = [], onChange, placeholder = "Select…", width, disabled }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  useOutsideClose(ref, () => setOpen(false));
  const labels = options.filter((o) => value.includes(o.value)).map((o) => o.label);
  const joined = labels.join(", ");
  const toggleVal = (v) => {
    const next = value.includes(v) ? value.filter((x) => x !== v) : [...value, v];
    onChange && onChange(next);
  };
  return (
    <div className="dd" ref={ref} style={{ width }}>
      <button type="button" disabled={disabled}
        className={`dd-trigger ${open ? "is-open" : ""} ${labels.length === 0 ? "is-placeholder" : ""}`}
        onClick={() => setOpen((p) => !p)}
        aria-haspopup="listbox" aria-expanded={open} aria-multiselectable="true">
        <span className="dd-trigger-label">
          {labels.length === 0 ? placeholder : (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
              <span style={{
                display: "inline-block", padding: "1px 7px",
                borderRadius: 9999, background: "var(--indigo-50)",
                color: "var(--indigo-700)", fontSize: 11, fontWeight: 600,
              }}>{labels.length}</span>
              <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{joined}</span>
            </span>
          )}
        </span>
        <_IconChev className="chev" />
      </button>
      {open && (
        <div className="dd-popover" role="listbox">
          {options.length === 0 && (
            <div style={{ padding: 10, fontSize: 13, color: "var(--gray-500)" }}>No options available</div>
          )}
          {options.map((o) => {
            const isSel = value.includes(o.value);
            return (
              <div key={o.value}
                className={`dd-item ${isSel ? "is-selected" : ""} ${o.disabled ? "is-disabled" : ""}`}
                role="option" aria-selected={isSel}
                onClick={() => { if (o.disabled) return; toggleVal(o.value); }}>
                <span className="leading" style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                  <span className="dd-check"><_IconCheck /></span>
                  {o.icon}{o.label}
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MenuPopover({ trigger, items = [], align = "start" }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  useOutsideClose(ref, () => setOpen(false));
  return (
    <div className="dd" ref={ref} style={{ display: "inline-block" }}>
      <span onClick={() => setOpen((p) => !p)}>{trigger}</span>
      {open && (
        <div className="dd-popover" role="menu"
             style={{ minWidth: 180,
                      left: align === "end" ? "auto" : 0,
                      right: align === "end" ? 0 : "auto" }}>
          {items.map((it, i) => {
            if (it === "divider") return <div key={i} className="dd-divider" />;
            return (
              <div key={i}
                className={`dd-item ${it.danger ? "is-danger" : ""} ${it.disabled ? "is-disabled" : ""}`}
                role="menuitem"
                onClick={() => { if (it.disabled) return; it.onClick && it.onClick(); setOpen(false); }}>
                <span className="leading" style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                  {it.icon}{it.label}
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function KebabMenu({ items, align = "end", size = "md" }) {
  return (
    <MenuPopover align={align} items={items}
      trigger={
        <button type="button" className={`icon-btn icon-btn-${size}`} aria-label="More actions">
          <_IconKebab />
        </button>
      } />
  );
}

function IconButton({ icon, variant = "ghost", size = "md", label, dot, className = "", ...rest }) {
  const variantCls = variant === "ghost" ? "" : `icon-btn-${variant}`;
  const dotColor = dot === true ? "red" : dot;

function Modal({ open, onClose, size = "md", title, subtitle, children, footer, showClose = true, closeOnScrim = true }) {
  React.useEffect(() => {
    if (!open) return;
    function onKey(e) { if (e.key === "Escape") onClose && onClose(); }
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = prev; document.removeEventListener("keydown", onKey); };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="modal-scrim" role="dialog" aria-modal="true"
         onClick={() => closeOnScrim && onClose && onClose()}>
      <div className={`modal-card modal-${size}`} onClick={(e) => e.stopPropagation()}>
        {(title || subtitle || showClose) && (
          <div className="modal-header">
            <div style={{ minWidth: 0, flex: 1 }}>
              {title && <h2 className="modal-title">{title}</h2>}
              {subtitle && <p className="modal-sub">{subtitle}</p>}
            </div>
            {showClose && (
              <button type="button" className="icon-btn icon-btn-sm" aria-label="Close" onClick={onClose}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                     strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
              </button>
            )}
          </div>
        )}
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

function NewConfirmDialog({ open, onConfirm, onCancel, title, body, confirmLabel = "Confirm", cancelLabel = "Cancel", danger = false, isPending = false }) {

};

const ToastContext = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = React.useState([]);
  const dismissToast = React.useCallback((id) => {
    setToasts((p) => p.map((t) => t.id === id ? { ...t, leaving: true } : t));
    setTimeout(() => setToasts((p) => p.filter((t) => t.id !== id)), 180);
  }, []);
  const showToast = React.useCallback((opts) => {
    if (typeof opts === "string") opts = { title: opts };
    const id = Math.random().toString(36).slice(2, 9);
    const t = { id, variant: "default", duration: 2500, ...opts };
    setToasts((p) => [...p, t]);
    if (t.duration > 0) setTimeout(() => dismissToast(id), t.duration);
    return id;
  }, [dismissToast]);
  return (
    <ToastContext.Provider value={{ showToast, dismissToast }}>
      {children}
      <div className="toast-region">
        {toasts.map((t) => <ToastView key={t.id} {...t} onDismiss={() => dismissToast(t.id)} />)}
      </div>
    </ToastContext.Provider>
  );
}
function useToast() {
  const ctx = React.useContext(ToastContext);
  if (!ctx) throw new Error("useToast must be inside <ToastProvider>");
  return ctx;
}
function ToastView({ variant = "default", title, body, leaving, onDismiss }) {
  return (
    <div className={`toast toast-${variant} ${leaving ? "is-leaving" : ""}`} role="status">
      {ToastIcons[variant] && <span className="toast-icon">{ToastIcons[variant]}</span>}
      <div className="toast-content">
        {title && <p className="toast-title">{title}</p>}
        {body && <p className="toast-body">{body}</p>}
      </div>
      <button className="toast-close" aria-label="Dismiss" onClick={onDismiss}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
             strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  );
}

function Tooltip({ content, placement = "top", children, delay = 400 }) {
  const [open, setOpen] = React.useState(false);
  const timerRef = React.useRef(null);
  const show = () => { clearTimeout(timerRef.current); timerRef.current = setTimeout(() => setOpen(true), delay); };
  const hide = () => { clearTimeout(timerRef.current); setOpen(false); };
  React.useEffect(() => () => clearTimeout(timerRef.current), []);
  return (
    <span className="tooltip-wrap" data-tooltip-open={open}
          onMouseEnter={show} onMouseLeave={hide} onFocus={show} onBlur={hide}>
      {children}
      <span className={`tooltip tooltip-${placement}`} role="tooltip">{content}</span>
    </span>
  );
}

  );
}

// Poll-taking and Poll dashboard components

function QuestionRenderer({ question, value, onChange, error }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <p style={{ margin: 0, fontSize: 14, fontWeight: 500, color: "var(--gray-900)" }}>
        {question.text}
        {question.isRequired && <span style={{ marginLeft: 4, color: "var(--red-600)" }}>*</span>}
      </p>

      {question.type === "SINGLE_CHOICE" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {question.options.map((o) => (
            <label key={o.id} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
              <input
                type="radio"
                name={`q-${question.id}`}
                checked={value === o.id}
                onChange={() => onChange(o.id)}
                style={{ accentColor: "var(--indigo-600)", width: 16, height: 16 }}
              />
              <span className="text-sm text-gray-700">{o.text}</span>
            </label>
          ))}
        </div>
      )}

      {question.type === "MULTIPLE_CHOICE" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {question.options.map((o) => {
            const arr = Array.isArray(value) ? value : [];
            const checked = arr.includes(o.id);
            return (
              <label key={o.id} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                <input
                  type="checkbox"
                  checked={checked}
                  onChange={() => onChange(checked ? arr.filter((v) => v !== o.id) : [...arr, o.id])}
                  style={{ accentColor: "var(--indigo-600)", width: 16, height: 16 }}
                />
                <span className="text-sm text-gray-700">{o.text}</span>
              </label>
            );
          })}
        </div>
      )}

      {question.type === "TEXT" && (
        <textarea
          className="textarea"
          rows={3}
          placeholder="Your answer…"
          value={typeof value === "string" ? value : ""}
          onChange={(e) => onChange(e.target.value)}
        />
      )}

      {error && <p className="error-text">{error}</p>}
    </div>
  );
}

                  <td><Badge variant={p.visibility === "PUBLIC" ? "success" : "default"}>{p.visibility}</Badge></td>
                  <td><Badge variant={p.isActive ? "info" : "danger"}>{p.isActive ? "Active" : "Inactive"}</Badge></td>
                  <td>{p.responseCount}</td>
                  <td>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button className="btn btn-row" onClick={() => setAnalyticsPoll(p)} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>

                      </button>
                      <button className="btn btn-soft-primary" onClick={() => setEditPoll(p)}>Edit</button>
                      <button className="btn btn-soft-danger" onClick={() => setConfirmDel(p)}>Delete</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {confirmDel && (
        <ConfirmDialog
          title="Delete poll?"
          body={<>Are you sure you want to delete <b>{confirmDel.title}</b>? This will remove all responses and cannot be undone.</>}
          confirmLabel="Delete"
          onCancel={() => setConfirmDel(null)}
          onConfirm={() => { onDelete?.(confirmDel); setConfirmDel(null); }}
        />
      )}
      {editPoll && (
        <PollCreateModal onClose={() => setEditPoll(null)} />
      )}
      {analyticsPoll && (
        <AnalyticsModal poll={analyticsPoll} onClose={() => setAnalyticsPoll(null)} />
      )}
    </>
  );
}

function AdminUsersTable({ users }) {
  const [sel, setSel] = React.useState([]);
  const [confirmDel, setConfirmDel] = React.useState(null);
  const [editUser, setEditUser] = React.useState(null);
  const allIds = users.map((u) => u.id);
  const allSelected = allIds.length > 0 && allIds.every((id) => sel.includes(id));
  const toggleAll = () => setSel(allSelected ? [] : allIds);
  const toggleOne = (id) => setSel((p) => p.includes(id) ? p.filter((x) => x !== id) : [...p, id]);

  return (
    <>
      <div className="flex items-center justify-between" style={{ marginBottom: 12 }}>
        <p className="text-sm text-gray-500" style={{ margin: 0 }}>
          {sel.length > 0 ? `${sel.length} selected` : `${users.length} users`}
        </p>
        <Button variant="secondary" size="sm">Export CSV</Button>
      </div>

      {sel.length > 0 && (
        <div className="card card-sm" style={{
          marginBottom: 12, background: "var(--indigo-50)", border: "1px solid var(--indigo-100)",
          padding: 14, display: "flex", alignItems: "center", justifyContent: "space-between",
        }}>
          <span className="text-sm" style={{ color: "var(--indigo-700)", fontWeight: 500 }}>
            {sel.length} {sel.length === 1 ? "user" : "users"} selected
          </span>
          <div className="flex gap-2">
            <Button variant="secondary" size="sm" onClick={() => setSel([])}>Clear</Button>
            <Button variant="danger" size="sm">Delete selected</Button>
          </div>
        </div>
      )}

      <div className="table-wrap">
        <table className="table">
          <thead>
            <tr>
              <th style={{ width: 40 }}>
                <input type="checkbox" checked={allSelected} onChange={toggleAll} style={{ accentColor: "var(--indigo-600)" }} />
              </th>
              <th>User</th><th>Role</th><th>Joined</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {users.map((u) => {
              const isSel = sel.includes(u.id);
              return (
                <tr key={u.id} className={isSel ? "is-selected" : ""}>
                  <td>
                    <input type="checkbox" checked={isSel} onChange={() => toggleOne(u.id)} style={{ accentColor: "var(--indigo-600)" }} />
                  </td>
                  <td>
                    <div className="flex items-center gap-3">
                      <Avatar name={u.name} />
                      <div>
                        <p style={{ margin: 0, fontSize: 14, fontWeight: 500, color: "var(--gray-900)" }}>{u.name}</p>
                        <p style={{ margin: 0, fontSize: 12, color: "var(--gray-500)" }}>{u.email}</p>
                      </div>
                    </div>
                  </td>
                  <td><Badge variant={u.role === "ADMIN" ? "info" : "default"}>{u.role}</Badge></td>
                  <td>{u.joined}</td>
                  <td>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button className="btn btn-soft-primary" onClick={() => setEditUser(u)}>Edit</button>
                      <button className="btn btn-soft-danger" onClick={() => setConfirmDel(u)}>Delete</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {confirmDel && (
        <ConfirmDialog
          title="Delete user?"
          body={<>Are you sure you want to delete <b>{confirmDel.name}</b>? This action cannot be undone.</>}
          confirmLabel="Delete"
          onCancel={() => setConfirmDel(null)}
          onConfirm={() => setConfirmDel(null)}
        />
      )}
      {editUser && (
        <UserEditModal user={editUser} onClose={() => setEditUser(null)} />
      )}

  );
}

/* Analytics — total + per-question breakdowns */
function AnalyticsView({ totalResponses, questions, regions }) {
  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 16 }}>
        <div className="card card-md">
          <p className="text-sm font-medium text-gray-500" style={{ margin: 0 }}>Total responses</p>
          <p style={{ margin: "4px 0 0", fontSize: 36, fontWeight: 700, color: "var(--gray-900)", lineHeight: 1 }}>{totalResponses}</p>
          <p className="text-xs text-gray-500" style={{ margin: "10px 0 0" }}>+12 in the last 7 days</p>
        </div>
        {regions && regions.length > 0 && (
          <RespondentAreasCard regions={regions} total={totalResponses} />
        )}
      </div>

      <div style={{ marginTop: 24 }}>
        <h2 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 600, color: "var(--gray-900)" }}>Question breakdown</h2>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          {questions.map((q) => (
            <QuestionAnalyticsCard key={q.id} q={q} />
          ))}
        </div>
      </div>
    </>

function RespondentAreasCard({ regions, total }) {
  const size = 132, stroke = 22, r = (size - stroke) / 2, C = 2 * Math.PI * r;
  let offset = 0;
  const segments = regions.map((reg) => {
    const len = (reg.pct / 100) * C;
    const seg = { ...reg, dasharray: `${len} ${C - len}`, dashoffset: -offset };
    offset += len;
    return seg;
  });
  const top = regions[0];
  return (
    <div className="card card-md">
      <div className="flex" style={{ alignItems: "flex-start", justifyContent: "space-between", marginBottom: 12 }}>
        <div>
          <p className="text-sm font-medium text-gray-500" style={{ margin: 0 }}>Respondent areas</p>
          <p className="text-xs text-gray-500" style={{ margin: "2px 0 0" }}>Distribution by region</p>
        </div>
        <Badge variant="default">{regions.length} regions</Badge>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
        <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: "rotate(-90deg)" }}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--gray-100)" strokeWidth={stroke} />
            {segments.map((s) => (
              <circle key={s.id} cx={size/2} cy={size/2} r={r} fill="none"
                stroke={s.color} strokeWidth={stroke}
                strokeDasharray={s.dasharray} strokeDashoffset={s.dashoffset}
                strokeLinecap="butt" />
            ))}
          </svg>
          <div style={{
            position: "absolute", inset: 0, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center", textAlign: "center",
          }}>
            <span style={{ fontSize: 11, color: "var(--gray-500)", textTransform: "uppercase", letterSpacing: ".06em" }}>Top</span>
            <span style={{ fontSize: 13, fontWeight: 600, color: "var(--gray-900)", marginTop: 1 }}>{top?.name}</span>
            <span style={{ fontSize: 12, color: "var(--gray-500)", marginTop: 1 }}>{top?.pct.toFixed(0)}%</span>
          </div>
        </div>
        <div style={{ flex: 1, display: "grid", gridTemplateColumns: "1fr 1fr", columnGap: 16, rowGap: 8 }}>
          {regions.map((reg) => (
            <div key={reg.id} className="flex items-center" style={{ gap: 8, minWidth: 0 }}>
              <span style={{ width: 8, height: 8, borderRadius: 9999, background: reg.color, flexShrink: 0 }} />
              <span style={{ fontSize: 13, color: "var(--gray-700)", flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{reg.name}</span>
              <span style={{ fontSize: 12, color: "var(--gray-500)", fontVariantNumeric: "tabular-nums" }}>{reg.pct.toFixed(1)}%</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function QuestionAnalyticsCard({ q }) {
  if (q.type === "text") return <FreeTextAnalyticsCard q={q} />;
  return (
    <div className="card card-sm">
      <div className="flex" style={{ justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
        <h3 style={{ margin: 0, fontSize: 14, fontWeight: 600, color: "var(--gray-900)" }}>{q.text}</h3>
        <Badge variant="default">{q.total} {q.total === 1 ? "answer" : "answers"}</Badge>
      </div>
      <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 12 }}>
        {q.options.map((opt) => (
          <div key={opt.id}>
            <div className="flex" style={{ justifyContent: "space-between", fontSize: 12, color: "var(--gray-700)", marginBottom: 4 }}>
              <span>{opt.text}</span>
              <span style={{ fontWeight: 500 }}>{opt.count} ({opt.pct.toFixed(1)}%)</span>
            </div>
            <div style={{ height: 8, background: "var(--gray-100)", borderRadius: 9999, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${Math.min(opt.pct, 100)}%`, background: "var(--indigo-500)" }} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function FreeTextAnalyticsCard({ q }) {
  const [analysis, setAnalysis] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [expanded, setExpanded] = React.useState(false);

  const visible = expanded ? q.answers : q.answers.slice(0, 3);

  const sparkleIcon = (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" width="14" height="14" aria-hidden="true">
      <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" />
      <path d="M12 8a4 4 0 0 0 0 8 4 4 0 0 0 0-8z" />
    </svg>
  );

  async function analyze() {
    setLoading(true);
    setError(null);
    setAnalysis(null);
    try {
      const prompt = `You are analyzing open-text responses to a survey question. Return STRICT JSON of the shape:
{
  "summary": string (1-2 sentences),
  "sentiment": { "positive": number, "neutral": number, "negative": number } (percentages, sum 100),
  "themes": [ { "label": string, "count": number, "quote": string } ] (3-5 themes, quote is a short verbatim from the input)
}
Do not include any prose outside the JSON.

Question: ${q.text}

Responses:
${q.answers.map((a, i) => `${i + 1}. ${a}`).join("\n")}`;
      const raw = await window.claude.complete(prompt);
      const jsonStr = raw.match(/\{[\s\S]*\}/)?.[0] || raw;
      const parsed = JSON.parse(jsonStr);
      setAnalysis(parsed);
    } catch (e) {
      setError("Could not analyze responses. Try again.");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="card card-sm">
      <div className="flex" style={{ justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
        <div style={{ minWidth: 0, flex: 1 }}>
          <h3 style={{ margin: 0, fontSize: 14, fontWeight: 600, color: "var(--gray-900)" }}>{q.text}</h3>
          <p className="text-xs text-gray-500" style={{ margin: "4px 0 0" }}>Free-text · {q.total} {q.total === 1 ? "response" : "responses"}</p>
        </div>
        <Button size="sm" variant={analysis ? "secondary" : "primary"}
          onClick={analyze} isLoading={loading}
          style={{ display: "inline-flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
          {!loading && sparkleIcon}<span>{analysis ? "Re-analyze" : "Analyze with AI"}</span>
        </Button>
      </div>

      {analysis && (
        <div style={{
          marginTop: 14, padding: 14,
          background: "linear-gradient(180deg, var(--indigo-50), #fff)",
          border: "1px solid var(--indigo-100)", borderRadius: 10,
        }}>
          <div className="flex items-center" style={{ gap: 6, marginBottom: 8 }}>
            <span style={{ color: "var(--indigo-600)" }}>{sparkleIcon}</span>
            <span style={{ fontSize: 11, fontWeight: 600, color: "var(--indigo-700)", textTransform: "uppercase", letterSpacing: ".06em" }}>AI summary</span>
          </div>
          <p style={{ margin: 0, fontSize: 13, color: "var(--gray-800)", lineHeight: 1.55 }}>{analysis.summary}</p>

          {analysis.sentiment && (
            <div style={{ marginTop: 12 }}>
              <p className="text-xs text-gray-500" style={{ margin: "0 0 6px" }}>Sentiment</p>
              <div style={{ display: "flex", height: 8, borderRadius: 9999, overflow: "hidden", background: "var(--gray-100)" }}>
                <div style={{ width: `${analysis.sentiment.positive}%`, background: "#10B981" }} title={`Positive ${analysis.sentiment.positive}%`} />
                <div style={{ width: `${analysis.sentiment.neutral}%`,  background: "#9CA3AF" }} title={`Neutral ${analysis.sentiment.neutral}%`} />
                <div style={{ width: `${analysis.sentiment.negative}%`, background: "#EF4444" }} title={`Negative ${analysis.sentiment.negative}%`} />
              </div>
              <div className="flex" style={{ gap: 12, marginTop: 6, fontSize: 12, color: "var(--gray-600)" }}>
                <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 9999, background: "#10B981", marginRight: 5 }} />Positive {analysis.sentiment.positive}%</span>
                <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 9999, background: "#9CA3AF", marginRight: 5 }} />Neutral {analysis.sentiment.neutral}%</span>
                <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 9999, background: "#EF4444", marginRight: 5 }} />Negative {analysis.sentiment.negative}%</span>
              </div>
            </div>
          )}

          {Array.isArray(analysis.themes) && analysis.themes.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <p className="text-xs text-gray-500" style={{ margin: "0 0 8px" }}>Top themes</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {analysis.themes.map((t, i) => (
                  <div key={i} style={{ background: "#fff", border: "1px solid var(--gray-200)", borderRadius: 8, padding: "10px 12px" }}>
                    <div className="flex items-center" style={{ gap: 8, justifyContent: "space-between" }}>
                      <span style={{ fontSize: 13, fontWeight: 600, color: "var(--gray-900)" }}>{t.label}</span>
                      <Badge variant="info">{t.count}</Badge>
                    </div>
                    {t.quote && (
                      <p style={{ margin: "6px 0 0", fontSize: 12, color: "var(--gray-600)", fontStyle: "italic", lineHeight: 1.5 }}>
                        “{t.quote}”
                      </p>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {error && (
        <div style={{ marginTop: 12, padding: "10px 12px", background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 8, fontSize: 13, color: "#991B1B" }}>
          {error}
        </div>
      )}

      <div style={{ marginTop: 14 }}>
        <p className="text-xs text-gray-500" style={{ margin: "0 0 8px" }}>Recent responses</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {visible.map((a, i) => (
            <div key={i} style={{
              padding: "10px 12px", background: "var(--gray-50)",
              border: "1px solid var(--gray-200)", borderRadius: 8,
              fontSize: 13, color: "var(--gray-700)", lineHeight: 1.55,
            }}>“{a}”</div>
          ))}
        </div>
        {q.answers.length > 3 && (
          <button className="btn btn-row" style={{ marginTop: 8 }} onClick={() => setExpanded((v) => !v)}>
            {expanded ? "Show fewer" : `Show all ${q.answers.length}`}
          </button>
        )}
      </div>
    </div>
  );
}

function AnalyticsModal({ poll, onClose }) {

      <div style={{ background: "var(--gray-50)", margin: -20, padding: "20px 24px" }}>
        <div style={{ maxWidth: 880, margin: "0 auto" }}>
          <AnalyticsView totalResponses={data.totalResponses} questions={data.questions} regions={data.regions} />
        </div>
      </div>
    </Modal>
  );
}

function AutoTextarea({ value, onChange, placeholder, style }) {
  const ref = useRefC(null);
  useEffectC(() => {
    if (ref.current) {
      ref.current.style.height = "auto";
      ref.current.style.height = ref.current.scrollHeight + "px";
    }
  }, [value]);
  return (
    <textarea ref={ref} value={value} placeholder={placeholder} rows={1}
      onChange={(e) => onChange(e.target.value)}
      style={{
        width: "100%", border: 0, outline: 0, resize: "none",
        background: "transparent", padding: 0, fontFamily: "inherit",
        color: "var(--gray-900)", lineHeight: 1.4, overflow: "hidden",
        ...style,
      }} />
  );
}

function OptionRow({ option, isMulti, onChange, onRemove, canRemove }) {
  const [focus, setFocus] = useStateC(false);
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 10,
      padding: "6px 8px", marginLeft: -8, borderRadius: 8,
      background: focus ? "var(--gray-50)" : "transparent",
      transition: "background-color 150ms ease",
    }}>
      <span style={{ color: "var(--gray-300)", display: "inline-flex", cursor: "grab" }} title="Drag to reorder">{I.Drag}</span>
      <span style={{
        width: 16, height: 16, border: "2px solid var(--gray-300)",
        borderRadius: isMulti ? 4 : 9999, flexShrink: 0,
      }} />
      <input value={option.text}
        onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
        onChange={(e) => onChange({ text: e.target.value })}
        placeholder="Option label"
        style={{
          flex: 1, border: 0, outline: 0, background: "transparent",
          padding: "4px 0", fontSize: 14, color: "var(--gray-900)", fontFamily: "inherit",
        }} />
      {canRemove && (
        <IconButton size="sm" label="Remove option" onClick={onRemove} icon={I.X}
          style={{ opacity: focus ? 1 : 0.4, transition: "opacity 150ms ease" }} />
      )}
    </div>
  );
}

function LogicRow({ logic, allQuestions, onChange, onRemove }) {
  const source = allQuestions.find((q) => q.id === logic.sourceQid) || allQuestions[0];
  const sourceOptions = (source?.options || []).map((o) => ({
    value: o.id, label: o.text || "Untitled option",
  }));
  return (
    <div style={{
      margin: "20px 24px 0", padding: 16,
      background: "var(--indigo-50)", border: "1px solid var(--indigo-100)",
      borderRadius: 10,
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 8,
                      color: "var(--indigo-700)", fontWeight: 600, fontSize: 13 }}>
          {I.Branch}
          Show this question if
        </div>
        <IconButton size="sm" variant="indigo" label="Remove logic" onClick={onRemove} icon={I.X} />
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <Dropdown width={240} value={logic.sourceQid}
          onChange={(v) => onChange({ sourceQid: v, values: [] })}
          options={allQuestions.length
            ? allQuestions.map((q, i) => ({
                value: q.id, label: `ID ${i + 1}: ${q.text || "Untitled question"}`,
              }))
            : [{ value: "", label: "No eligible question" }]
          } />
        <Dropdown width={160} value={logic.op}
          onChange={(v) => onChange({ op: v })}
          options={[
            { value: "EQUALS_ANY",     label: "equals any of" },
            { value: "EQUALS_ALL",     label: "equals all of" },
            { value: "NOT_EQUALS_ANY", label: "is not" },
          ]} />
        <MultiSelect width={220} options={sourceOptions}
          value={logic.values} onChange={(values) => onChange({ values })}
          placeholder="Select answer(s)" />
      </div>
    </div>
  );
}

function QuestionCard({ q, index, allPrior, onChange, onDelete, onDuplicate }) {
  const set = (patch) => onChange({ ...q, ...patch });
  const setOption = (oid, patch) => set({ options: q.options.map((o) => o.id === oid ? { ...o, ...patch } : o) });
  const addOption = () => set({ options: [...(q.options || []), { id: `o${Date.now()}`, text: "" }] });
  const removeOption = (oid) => set({ options: q.options.filter((o) => o.id !== oid) });
  const showOptions = q.type !== "TEXT";

  return (
    <div className="card card-md" style={{ padding: 0 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 24px 0" }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 6,
                      color: "var(--gray-400)", fontSize: 13, fontWeight: 500 }}>
          {I.Copy}
          <span>ID {index + 1}</span>
        </div>
        <KebabMenu items={[
          { icon: I.Copy,  label: "Duplicate", onClick: onDuplicate },
          { icon: I.Trash, label: "Delete",    onClick: onDelete, danger: true },
        ]} />
      </div>

      <div style={{ padding: "8px 24px 0", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <Dropdown value={q.type} options={TYPE_OPTIONS} onChange={(v) => set({ type: v })} width={190} />
      </div>

      {showOptions && (
        <div style={{ padding: "16px 24px 0", display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
          <Toggle checked={!!q.shuffle}  onChange={(v) => set({ shuffle: v })}  label="Shuffle answers" />
          <Toggle checked={!!q.required} onChange={(v) => set({ required: v })} label="Required" />
        </div>
      )}

      <div style={{ padding: "20px 24px 0" }}>
        <AutoTextarea value={q.text} onChange={(v) => set({ text: v })}
          placeholder="Question text"
          style={{ fontSize: 16, fontWeight: 600, color: "var(--gray-900)" }} />
      </div>

      {showOptions && (
        <div style={{ padding: "16px 24px 0", display: "flex", flexDirection: "column", gap: 4 }}>
          {q.options.map((o) => (
            <OptionRow key={o.id} option={o}
              isMulti={q.type === "MULTIPLE_CHOICE"}
              onChange={(patch) => setOption(o.id, patch)}
              onRemove={() => removeOption(o.id)}
              canRemove={q.options.length > 1} />
          ))}
        </div>
      )}

      {q.type === "TEXT" && (
        <div style={{ padding: "12px 24px 0" }}>
          <div style={{
            padding: 14, border: "1px dashed var(--gray-300)", borderRadius: 8,
            background: "var(--gray-50)", color: "var(--gray-500)", fontSize: 13,
          }}>
            Respondents will type a free-text answer. No options to configure.
          </div>
        </div>
      )}

      {showOptions && (
        <div style={{ padding: "12px 24px 0", display: "flex", alignItems: "center", gap: 12,
                      fontSize: 14, color: "var(--indigo-600)" }}>
          <button onClick={addOption} style={{
            display: "inline-flex", alignItems: "center", gap: 6,
            background: "transparent", border: 0, padding: 0, cursor: "pointer",
            color: "var(--indigo-600)", fontWeight: 500, fontSize: 14, fontFamily: "inherit",
          }}>
            {I.Plus}
            Add option
          </button>
        </div>
      )}

      <div style={{ height: 24 }} />
    </div>
  );
}

function HeaderCard({ title, onTitleChange, kind, onPreview, onShare, onBookmark, bookmarked }) {
  const [editing, setEditing] = useStateC(false);
  const inputRef = useRefC(null);
  useEffectC(() => { if (editing && inputRef.current) inputRef.current.select(); }, [editing]);
  return (
    <div className="card card-md">
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <Badge variant="default">{kind}</Badge>
        <span style={{
          display: "inline-flex", alignItems: "center", padding: "2px 10px", borderRadius: 9999,
          fontSize: 12, fontWeight: 500,
          background: "var(--indigo-100)", color: "var(--indigo-700)",

      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12 }}>

function PollCreateScreen({ onNav, hidePublishBar = false }) {
  const [title, setTitle] = useStateC("Poll from 3/30/2024");
  const [bookmarked, setBookmarked] = useStateC(false);
  const [questions, setQuestions] = useStateC([
    {
      id: "q1", type: "SINGLE_CHOICE", text: "Test question",
      shuffle: false, required: true,
      options: [{ id: "o1", text: "Yes" }, { id: "o2", text: "No" }],
    },
    {
      id: "q2", type: "MULTIPLE_CHOICE", text: "",
      shuffle: false, required: false,
      options: [{ id: "o3", text: "" }, { id: "o4", text: "" }],
    },
  ]);

  const update = (id, next) => setQuestions((qs) => qs.map((q) => q.id === id ? next : q));
  const remove = (id) => setQuestions((qs) => qs.filter((q) => q.id !== id));
  const duplicate = (id) => setQuestions((qs) => {
    const i = qs.findIndex((q) => q.id === id);
    if (i < 0) return qs;
    const copy = JSON.parse(JSON.stringify(qs[i]));
    copy.id = `q${Date.now()}`;
    copy.options = (copy.options || []).map((o, k) => ({ ...o, id: `o${Date.now()}-${k}` }));
    return [...qs.slice(0, i + 1), copy, ...qs.slice(i + 1)];
  });
  const add = () => setQuestions((qs) => [
    ...qs,
    {
      id: `q${Date.now()}`, type: "SINGLE_CHOICE", text: "",
      shuffle: false, required: false,
      options: [
        { id: `o${Date.now()}-1`, text: "" },
        { id: `o${Date.now()}-2`, text: "" },
      ],
    },
  ]);

  return (
    <div style={{ maxWidth: 880, margin: "0 auto" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <HeaderCard
            title={title} onTitleChange={setTitle} kind="Simple poll"
            bookmarked={bookmarked} onBookmark={() => setBookmarked((b) => !b)}
            onPreview={() => {}} onShare={() => {}} />

          {questions.map((q, i) => (
            <QuestionCard key={q.id} q={q} index={i}
              allPrior={questions.slice(0, i)}
              onChange={(next) => update(q.id, next)}
              onDelete={() => remove(q.id)}
              onDuplicate={() => duplicate(q.id)} />
          ))}

          <AddQuestionButton onAdd={add} />
        </div>

      {!hidePublishBar && (
        <PublishBar onSaveDraft={() => {}} onPublish={() => onNav && onNav("dashboard")} />
      )}
    </div>
  );
}

      questions: [
        { id:"q1", text:"How would you rate your overall workload?", total:47, options:[
          { id:"o1", text:"Light",        count:6,  pct:12.8 },
          { id:"o2", text:"Just right",   count:24, pct:51.1 },
          { id:"o3", text:"Heavy",        count:13, pct:27.7 },
          { id:"o4", text:"Overwhelming", count:4,  pct:8.5  },
        ]},
        { id:"q2", text:"Which areas would you like more support in?", total:39, options:[
          { id:"p1", text:"Career growth",        count:22, pct:56.4 },
          { id:"p2", text:"Technical mentorship", count:18, pct:46.2 },
          { id:"p3", text:"Cross-team work",      count:9,  pct:23.1 },
          { id:"p4", text:"Process & tooling",    count:14, pct:35.9 },
        ]},
      ],
    };

    function Toast({ msg }) {
      if (!msg) return null;
      return (
        <div style={{
          position: "fixed", top: 16, right: 16, zIndex: 60,
          background: "#fff", border: "1px solid var(--gray-200)", borderRadius: 8,
          padding: "10px 16px", fontSize: 14, color: "var(--gray-900)",
          boxShadow: "0 10px 25px -5px rgb(0 0 0 / 0.1)",
        }}>{msg}</div>
      );
    }

    function App() {
      const [route, setRoute] = useState("landing");
      const [dashTab, setDashTab] = useState("polls");
      const [openCreateModal, setOpenCreateModal] = useState(false);
      const [polls, setPolls] = useState(INITIAL_POLLS);
      const [submitted, setSubmitted] = useState(false);
      const [confirmDel, setConfirmDel] = useState(null);
      const [toast, setToast] = useState(null);

      const showToast = (m) => { setToast(m); setTimeout(() => setToast(null), 2200); };

      function handleDelete(poll) {
        setPolls((p) => p.filter((x) => x.id !== poll.id));
        setConfirmDel(null);
        showToast("Poll deleted");
      }
      function handleToggleActive(poll) {
        setPolls((p) => p.map((x) => x.id === poll.id ? { ...x, isActive: !x.isActive } : x));
      }

      if (route === "landing")  return <><LandingScreen onNav={setRoute} /><FloatingNav route={route} setRoute={setRoute} /><Toast msg={toast} /></>;
      if (route === "login")    return <><LoginScreen   onNav={setRoute} onSubmit={() => setRoute("dashboard")} /><FloatingNav route={route} setRoute={setRoute} /><Toast msg={toast} /></>;
      if (route === "register") return <><RegisterScreen onNav={setRoute} onSubmit={() => setRoute("dashboard")} /><FloatingNav route={route} setRoute={setRoute} /><Toast msg={toast} /></>;
      if (route === "create") {
        setRoute("dashboard");
        setOpenCreateModal(true);
        return null;
      }

      if (route === "poll") {
        return (
          <>
            <PollScreen poll={DEMO_POLL_FORM} submitted={submitted} onSubmit={() => setSubmitted(true)} />
            <FloatingNav route={route} setRoute={setRoute} />
            <Toast msg={toast} />
          </>
        );
      }
      if (route === "analytics") {
        // Standalone analytics route → redirect to dashboard analytics tab.
        setDashTab("analytics");
        setRoute("dashboard");
        return null;
      }
      if (route === "dashboard") {
        return (
          <>
            <DashboardScreen
              user={DEMO_USER} polls={polls}
              initialTab={dashTab}
              onCreate={() => setOpenCreateModal(true)}
              onEdit={() => showToast("Edit modal — not implemented in kit")}
              onDelete={(p) => setConfirmDel(p)}
              onToggleActive={handleToggleActive}
              onCopyLink={(p) => showToast(`Copied: /${p.slug}`)}
              onAnalytics={() => { setDashTab("analytics"); }}
              onSignOut={() => setRoute("landing")}
            />
            <FloatingNav route={route} setRoute={(r) => {
              if (r === "admin")  { setDashTab("all-users"); setRoute("dashboard"); }
              else if (r === "create") { setOpenCreateModal(true); }
              else { setDashTab("polls"); setRoute(r); }
            }} />
            {openCreateModal && <PollCreateModal onClose={() => setOpenCreateModal(false)} />}
            {confirmDel && (
              <ConfirmDialog
                title="Delete poll?"
                body={<>Are you sure you want to delete <b>{confirmDel.title}</b>? This action cannot be undone.</>}
                confirmLabel="Delete"
                onCancel={() => setConfirmDel(null)}
                onConfirm={() => handleDelete(confirmDel)}
              />
            )}
            <Toast msg={toast} />
          </>
        );
      }
      if (route === "admin") {
        // Admin route is now a redirect into the unified dashboard at the staff tab.
        setDashTab("all-users");
        setRoute("dashboard");
        return null;
      }
      return null;
    }

    function FloatingNav({ route, setRoute }) {
      const items = [
        ["landing","Landing"], ["login","Login"], ["register","Register"],
        ["dashboard","Dashboard"], ["create","Create"], ["poll","Poll"],
        ["admin","Staff"],
      ];
      return (
        <div style={{
          position: "fixed", bottom: 16, left: "50%", transform: "translateX(-50%)",
          background: "#111827", color: "#fff", borderRadius: 9999,
          padding: 4, display: "flex", gap: 2, boxShadow: "0 10px 25px -5px rgb(0 0 0 / 0.3)",
          zIndex: 40, fontSize: 12,
        }}>
          {items.map(([k, label]) => (
            <button key={k} onClick={() => setRoute(k)}
              style={{
                padding: "6px 12px", borderRadius: 9999, border: 0, cursor: "pointer",
                background: route === k ? "var(--indigo-600)" : "transparent",
                color: route === k ? "#fff" : "#d1d5db", fontWeight: 500, fontSize: 12,
              }}
            >{label}</button>
          ))}
        </div>
      );
    }

    function SystemPlaceholder() {
      return (
        <div className="card card-md">
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 600 }}>System health</h2>
          <p style={{ margin: "8px 0 0", fontSize: 14, color: "var(--gray-600)" }}>
            Real implementation polls <code>GET /api/v1/admin/system</code> for DB / queue / uptime.
            Not recreated in the kit.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
