name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests mock Prisma, but ts-jest still compiles `@prisma/client`
      # imports, so the generated client must exist.
      - name: Generate Prisma client
        run: npm --workspace backend exec -- prisma generate

      - name: Type-check (backend + frontend)
        run: npm run check:ts

      - name: Lint (backend + frontend)
        run: npm run lint

      - name: Backend unit tests
        run: npm --workspace backend test

      - name: Frontend unit tests
        run: npm --workspace frontend test

      - name: Build (backend + frontend)
        run: npm run build
